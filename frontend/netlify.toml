[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE_URL = "https://bebe-backend-production.up.railway.app/api/v1"

[[redirects]]
  from = "/api/*"
  to = "https://bebe-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sanctum/*"
  to = "https://bebe-backend-production.up.railway.app/sanctum/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
