services:
  - type: web
    name: bebe-backend
    env: php
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "composer install --no-dev --optimize-autoloader && php artisan config:clear"
    startCommand: "php artisan config:cache && php artisan route:cache && php artisan migrate --force && php -S 0.0.0.0:$PORT -t public"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
